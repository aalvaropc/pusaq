name: release-image

# Publishes the gateway and mock-provider images to Artifact Registry on every
# push to main. Authentication is workload identity federation: the workflow's
# OIDC token is exchanged for short-lived credentials of a service account
# that can only write to the Pusaq registry. No stored keys. The job is
# skipped when the repository variables produced by the cloud foundation
# (infra/terraform/foundation outputs) are unset.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_PATH: us-central1-docker.pkg.dev/aalvaropc/pusaq

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push pusaq
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: pusaq
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}/pusaq:${{ github.sha }}
            ${{ env.IMAGE_PATH }}/pusaq:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mockprovider
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: mockprovider
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}/mockprovider:${{ github.sha }}
            ${{ env.IMAGE_PATH }}/mockprovider:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
