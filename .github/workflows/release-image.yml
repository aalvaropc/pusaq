name: release-image

# Publishes the gateway and mock-provider images to Artifact Registry on every
# push to main. Authentication is workload identity federation: the workflow's
# OIDC token is exchanged for short-lived credentials of a service account
# that can only write to the Pusaq registry. No stored keys. The job is
# skipped until the repository variables produced by the cloud foundation
# (infra/terraform/foundation outputs) exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_PATH: us-central1-docker.pkg.dev/aalvaropc/pusaq

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push pusaq
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pusaq
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}/pusaq:${{ github.sha }}
            ${{ env.IMAGE_PATH }}/pusaq:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mockprovider
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mockprovider
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}/mockprovider:${{ github.sha }}
            ${{ env.IMAGE_PATH }}/mockprovider:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
