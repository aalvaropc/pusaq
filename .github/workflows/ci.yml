name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
      - run: make lint-docs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra/terraform
      - run: terraform -chdir=infra/terraform/foundation init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/foundation validate
      - run: terraform -chdir=infra/terraform/runtime init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/runtime validate
