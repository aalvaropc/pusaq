version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/foundation"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/runtime"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        update-types: [minor, patch]
