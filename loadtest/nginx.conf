# Local L7 balancer for the load-test profile.
# One worker process keeps the round-robin alternation between the two peers
# strict. A 429 is not an upstream failure for nginx (proxy_next_upstream
# excludes it by default), so an overloaded tenant never marks a peer down.
worker_processes 1;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  access_log off;

  upstream limited {
    server pusaq-a:8080;
    server pusaq-b:8080;
    keepalive 64;
  }

  upstream unlimited {
    server pusaq-nolimit-a:8080;
    server pusaq-nolimit-b:8080;
    keepalive 64;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://limited;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }

  server {
    listen 8081;
    location / {
      proxy_pass http://unlimited;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
}
