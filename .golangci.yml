version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: unreachable-code

formatters:
  enable:
    - gofmt
