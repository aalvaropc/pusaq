services:
  pusaq:
    build:
      context: .
      target: pusaq
    environment:
      PUSAQ_REDIS_ADDR: redis:6379
      PUSAQ_MOCK_URL: http://mockprovider:9090
      PUSAQ_RPM_LIMIT: "60"
      PUSAQ_RPM_BURST: "5"
      PUSAQ_TPM_LIMIT: "300"
      PUSAQ_TPM_RESERVE_DEFAULT: "50"
      PUSAQ_DRAIN_DELAY: 0s
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mockprovider:
        condition: service_started

  # redis:7 for Memorystore parity; backs the distributed rate limiter.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mockprovider:
    build:
      context: .
      target: mockprovider
    command: ["--addr", ":9090", "--latency-p50", "200ms", "--latency-p99", "2s", "--error-rate", "0"]
    ports:
      - "9090:9090"
